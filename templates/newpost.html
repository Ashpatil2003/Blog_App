{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>

body {
    background: #f4f7fb;
    font-family: Arial, Helvetica, sans-serif;
    color: #212529;
}


/* ==============================
   Navbar
   ============================== */

    .profile-btn {
        border-radius: 8px;
        padding: 0px 18px;
    }

    /* Page Heading */

    .blog-header {
        text-align: center;
        margin: 10px 0 30px;
    }

    .blog-header h1 {
        font-size: 34px;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 8px;
    }

    .blog-header p {
        color: #6b7280;
        font-size: 15px;
    }


/* ==============================
   New Post Card
   ============================== */

.post-card {
    max-width: 900px;
    margin: 40px auto;
    padding: 40px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
}

.post-title {
    font-size: 32px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 8px;
}

.post-subtitle {
    color: #6b7280;
    font-size: 15px;
    margin-bottom: 25px;
}


/* ==============================
   Form
   ============================== */

.form-label {
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
}

.form-control {
    border: 1px solid #d8dee8;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    transition: all 0.2s ease;
}

.form-control::placeholder {
    color: #9ca3af;
}

.form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
}

textarea.form-control {
    resize: vertical;
}


/* ==============================
   Publish Button
   ============================== */

.post-btn {
    border: none;
    border-radius: 10px;
    padding: 11px 28px;
    font-weight: 600;
    background: linear-gradient(135deg, #0d6efd, #4f8df7);
    transition: all 0.2s ease;
}

.post-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(13, 110, 253, 0.25);
}


/* ==============================
   Responsive Design
   ============================== */

@media (max-width: 768px) {

    .blog-navbar {
        padding: 8px 12px;
    }

    .blog-logo {
        width: 65px;
        height: 35px;
    }

    .post-card {
        margin: 25px 10px;
        padding: 25px 20px;
        border-radius: 14px;
    }

    .post-title {
        font-size: 26px;
    }

    .post-subtitle {
        font-size: 14px;
    }

    .post-btn {
        width: 100%;
    }
}
</style>

<div class="container custom-container">

    <nav class="navbar navbar-expand-lg navbar-light bg-light w-100">

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent" >
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a href="/home">
                        <img src="{% static 'images/blogslogo.jpeg' %}"  alt="Blog" style="width: 300px; height: 90px; object-fit: contain;" >
                    </a>
                </li>
            </ul>

            <div class="dropdown ms-auto">

                <button
                    class="btn btn-outline-primary dropdown-toggle"
                    type="button"
                    id="dropdownMenuButton"
                    data-bs-toggle="dropdown"
                    aria-expanded="false" >
                    Profile
                </button>


                <ul class="dropdown-menu dropdown-menu-end"  aria-labelledby="dropdownMenuButton">
                    <li>
                        <a class="dropdown-item" href="/home" > Home </a>
                    </li>


                    <li>
                        <a class="dropdown-item" href="/mypost"> My Posts </a>
                    </li>

                    <li>
                        <a class="dropdown-item"  href="/signout"> Sign Out </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <form method="post">
        {% csrf_token %}
        <div class="container custom-container" style="max-width: 1250px;">
            <br><br>
            <h1 class="fw-bolder">Make a new post. </h1>
            <hr>
            <br>


            <div class="mb-3">
                <h3>
                    <label for="exampleInputText" class="form-label">Heading/Title </label>
                </h3>
                  <input type="text"  class="form-control" id="exampleInputText" name="title">
            </div>


            <div class="mb-3">
                <h3>
                    <label  for="exampleFormControlTextarea3" class="form-label">Content </label>
                </h3>

                <textarea  class="form-control" id="exampleFormControlTextarea3" rows="7" name="content"></textarea>
            </div>


            <input class="btn btn-primary" type="submit" value="Post">
        </div>
    </form>
</div>
{% endblock %}
